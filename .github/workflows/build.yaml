name: README build
on:
  push:
    branches:
      - devel
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:  # 👈 enables manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.6'

      - name: Configure pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py

      - name: Commit
        run: |
          git add .
          git diff
          git config --global user.email "github-actions-bot@fowlfarmer.github.io"
          git config --global user.name "FowlFarmer/GitHub-Actions-Bot"
          git commit -m "Updated README" -a || echo "No changes to commit"
          git push